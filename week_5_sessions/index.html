<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Identity Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Student Login</h1>
        <p class="hint">Use the classroom credentials to create a virtual identity.</p>

        <form id="loginForm" method="POST" action="login.php">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <label for="captcha">CAPTCHA: What is 3 + 4?</label>
            <input type="number" id="captcha" name="captcha" required>

            <label class="checkbox-label">
                <input type="checkbox" name="remember_me" value="1">
                Remember my username
            </label>

            <button type="submit">Login</button>
        </form>

        <p class="hint">Demo username: <strong>student</strong></p>
        <p class="hint">Demo password: <strong>password123</strong></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
